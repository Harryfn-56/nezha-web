# =====================================================================
# Tự động build và tải lên Hostinger mỗi khi push code lên GitHub
# ---------------------------------------------------------------------
# Cần khai báo 3 "Secret" trong GitHub:
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#
#   FTP_SERVER    ví dụ: ftp.tenmiencuaban.com   (xem trong hPanel → Files → FTP Accounts)
#   FTP_USERNAME  tên đăng nhập FTP
#   FTP_PASSWORD  mật khẩu FTP
#
# Nếu chưa muốn dùng tự động, cứ chạy `npm run build` rồi kéo thả
# thư mục dist/ vào File Manager của Hostinger cũng được.
# =====================================================================

name: Build & Deploy lên Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:        # cho phép bấm chạy tay trong tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build website
        run: npm run build

      - name: Tải lên Hostinger qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
